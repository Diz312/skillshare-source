# MCP servers for every machine. Committed with `skillshare push`; each machine picks its
# receiving clients in its own config.yaml (mcp.targets). Pin exact versions; secrets only as
# fromEnv references (values live in ~/.secrets/agent.env on each machine).
servers:
  context7:
    url: https://mcp.context7.com/mcp
    bearerToken:
      fromEnv: CONTEXT7_API_KEY
  gitnexus:
    command: npx
    args:
      - -y
      - gitnexus@1.6.12
      - mcp
  playwright:
    command: npx
    args:
      - -y
      - '@playwright/mcp@0.0.85'
  rea:
    command: npx
    args:
      - -y
      - rea-agents@6.8.0
      - mcp
    targets:
      - claude
      - cursor
