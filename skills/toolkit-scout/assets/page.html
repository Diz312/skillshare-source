<title>Agent Toolkit Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: a parts catalog. Header with run summary, three views (Today / Installed / Watchlist),
   dense rows with pins and scores in mono. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #17202c; --muted: #5d6878; --line: #dfe3ea;
  --accent: #2d55c8; --accent-soft: #e6ecfb;
  --good: #1f7a4d; --good-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fbf0db; --bad: #b3372f;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --surface: #161d27; --fg: #e4e9f0; --muted: #94a0b2; --line: #263142;
  --accent: #7f9ff0; --accent-soft: #1d2a47;
  --good: #5fc690; --good-soft: #15302a; --warn: #e2ac4b; --warn-soft: #33290f; --bad: #ec7d74;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d27; --fg: #e4e9f0; --muted: #94a0b2; --line: #263142;
  --accent: #7f9ff0; --accent-soft: #1d2a47;
  --good: #5fc690; --good-soft: #15302a; --warn: #e2ac4b; --warn-soft: #33290f; --bad: #ec7d74;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: grid; gap: 6px; margin-bottom: 20px; }
h1 { font: 700 30px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta a, a { color: var(--accent); }
.summary { max-width: 68ch; margin: 8px 0 0; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.stat { font: 500 12px var(--mono); padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.stat b { font-weight: 500; color: var(--accent); }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 14px; overflow-x: auto; }
nav button { font: 500 14px var(--body); color: var(--muted); background: none; border: 0; padding: 9px 12px;
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { font: 14px var(--body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.filters input { flex: 1 1 220px; min-width: 0; }
h2 { font: 600 13px var(--body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 22px 0 8px; }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.row > div { min-width: 0; }
.name { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.name a { color: var(--fg); text-decoration: none; }
.name a:hover { color: var(--accent); text-decoration: underline; }
.desc { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.why { margin-top: 6px; font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font: 500 11.5px var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.score { font: 500 20px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.score small { display: block; font: 11px var(--body); color: var(--muted); }
.empty { color: var(--muted); padding: 18px 14px; border: 1px dashed var(--line); border-radius: 8px; }
code { font: 12px var(--mono); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } .score { text-align: left; } h1 { font-size: 25px; } }
@media (prefers-reduced-motion: no-preference) { nav button { transition: color .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Agent Toolkit Catalog</h1>
    <div class="meta" id="meta"></div>
    <p class="summary" id="summary"></p>
    <div class="stats" id="stats"></div>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" id="tab-today" data-view="today">Today</button>
    <button role="tab" id="tab-installed" data-view="installed">Installed</button>
    <button role="tab" id="tab-watch" data-view="watch">Watchlist</button>
  </nav>
  <div class="filters">
    <input id="q" type="search" placeholder="Search names and descriptions" aria-label="Search">
    <select id="kind" aria-label="Type"><option value="">All types</option><option value="skill">Skills</option><option value="mcp">MCP servers</option><option value="plugin">Plugins</option></select>
    <select id="cat" aria-label="Category"><option value="">All categories</option></select>
  </div>
  <main id="view"></main>
</div>

<script>
const DATA = /*__DATA__*/null;
const D = DATA || { generated_at: "", summary: "No scout run yet.", installed: [], candidates: [], updates: [], categories: [] };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kindLabel = { skill: "skill", mcp: "MCP", plugin: "plugin" };
const ago = (iso) => { if (!iso) return ""; const d = (Date.now() - Date.parse(iso)) / 864e5; return d < 1 ? "today" : d < 60 ? Math.round(d) + "d ago" : Math.round(d / 30) + "mo ago"; };
const stars = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n || 0);

$("#meta").innerHTML = [
  D.generated_at ? `Last scout run ${esc(new Date(D.generated_at).toLocaleString())}` : "",
  D.pr_url ? `<a href="${esc(D.pr_url)}" target="_blank" rel="noopener">Open today's PR</a>` : "",
  D.repo_url ? `<a href="${esc(D.repo_url)}" target="_blank" rel="noopener">Repository</a>` : "",
].filter(Boolean).join("<span aria-hidden='true'>·</span>");
$("#summary").textContent = D.summary || "";
const proposed = D.candidates.filter((c) => c.verdict === "proposed");
$("#stats").innerHTML = [
  ["installed", D.installed.length], ["proposed today", proposed.length],
  ["updates", D.updates.length], ["on watchlist", D.candidates.filter((c) => c.verdict === "watch").length],
].map(([k, v]) => `<span class="stat"><b>${v}</b> ${k}</span>`).join("");
for (const c of D.categories) $("#cat").insertAdjacentHTML("beforeend", `<option value="${esc(c)}">${esc(c)}</option>`);

function match(it) {
  const q = $("#q").value.trim().toLowerCase(), k = $("#kind").value, c = $("#cat").value;
  if (k && it.kind !== k) return false;
  if (c && it.category !== c) return false;
  return !q || `${it.name} ${it.description} ${it.reason || ""} ${it.why || ""}`.toLowerCase().includes(q);
}
function tags(it) {
  const t = [`<span class="tag">${esc(kindLabel[it.kind] || it.kind)}</span>`];
  if (it.category) t.push(`<span class="tag plain">${esc(it.category)}</span>`);
  if (it.official) t.push(`<span class="tag good">official</span>`);
  if (it.origin === "local") t.push(`<span class="tag good">own</span>`);
  if (it.harness) t.push(`<span class="tag plain">${esc(it.harness)}</span>`);
  if (it.pin) t.push(`<span class="tag plain">${esc(it.pin)}</span>`);
  if (it.stars) t.push(`<span class="tag plain">★ ${stars(it.stars)}</span>`);
  if (it.pushed_at) t.push(`<span class="tag plain">updated ${ago(it.pushed_at)}</span>`);
  if (it.needs) t.push(`<span class="tag warn">needs ${esc(it.needs)}</span>`);
  return `<div class="tags">${t.join("")}</div>`;
}
function row(it, showScore) {
  const url = it.url || it.source_url;
  const name = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name);
  const note = it.reason || it.why;
  return `<div class="row"><div><div class="name">${name}</div>
    ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ""}
    ${note ? `<div class="why">${esc(note)}</div>` : ""}${tags(it)}</div>
    ${showScore && it.score != null ? `<div class="score">${Number(it.score).toFixed(0)}<small>score</small></div>` : ""}</div>`;
}
function section(title, items, showScore, emptyText) {
  return `<h2>${esc(title)} (${items.length})</h2>` +
    (items.length ? `<div class="list">${items.map((i) => row(i, showScore)).join("")}</div>` : `<div class="empty">${esc(emptyText)}</div>`);
}
let view = "today";
try { view = localStorage.getItem("toolkit-view") || "today"; } catch (e) {}
function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  const byScore = (a, b) => (b.score || 0) - (a.score || 0);
  let html = "";
  if (view === "today") {
    const ups = D.updates.map((u) => ({ kind: "skill", name: u.name, url: u.compare_url, description: `${u.current_ref.slice(0, 7)} → ${u.latest_ref.slice(0, 7)}`, reason: u.reason }));
    html = section("Proposed in today's PR", proposed.filter(match).sort(byScore), true, "Nothing new worth adding today.")
         + section("Updates to pinned skills", ups.filter(match), false, "Everything pinned is current.")
         + section("Rejected today", D.candidates.filter((c) => c.verdict === "rejected").filter(match).sort(byScore), true, "Nothing rejected.");
  } else if (view === "installed") {
    const order = ["skill", "mcp", "plugin"];
    html = order.map((k) => section({ skill: "Skills", mcp: "MCP servers", plugin: "Plugins" }[k],
      D.installed.filter((i) => i.kind === k).filter(match), false, "None yet.")).join("");
  } else {
    html = section("Watchlist", D.candidates.filter((c) => c.verdict === "watch").filter(match).sort(byScore), true, "Nothing on the watchlist.");
  }
  $("#view").innerHTML = html;
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
  view = b.dataset.view; try { localStorage.setItem("toolkit-view", view); } catch (e) {} render();
}));
["#q", "#kind", "#cat"].forEach((s) => $(s).addEventListener("input", render));
render();
</script>
